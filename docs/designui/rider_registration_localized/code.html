<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>RideLink India - Rider Registration</title>

<link href="https://fonts.googleapis.com" rel="preconnect">

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                    "surface-bright": "#f8f9fb",

                    "on-error-container": "#93000a",

                    "surface": "#f8f9fb",
                    "secondary": "#006c49",
                    "on-primary-container": "#eeefff",
                    "surface-dim": "#d9dadc",
                    "on-tertiary": "#ffffff",
                    "on-tertiary-fixed-variant": "#653e00",
                    "tertiary-fixed-dim": "#ffb95f",
                    "surface-container-highest": "#e1e2e4",

                    "on-tertiary-fixed": "#2a1700",

                    "outline-variant": "#c3c6d7",
                    "on-error": "#ffffff",
                    "on-primary-fixed-variant": "#003ea8",
                    "primary-fixed-dim": "#b4c5ff",
                    "inverse-on-surface": "#f0f1f3",
                    "inverse-primary": "#b4c5ff",
                    "error-container": "#ffdad6",
                    "on-surface-variant": "#434655",
                    "on-background": "#191c1e",
                    "on-tertiary-container": "#ffeedd",
                    "tertiary-fixed": "#ffddb8",
                    "surface-container": "#edeef0",
                    "primary-fixed": "#dbe1ff",
                    "outline": "#737686",

            },

<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px 0 rgba(0,0,0,0.04);
        }
        .active-squish:active {
            transform: scale(0.98);
            transition: transform 150ms cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="w-full top-0 sticky z-50 bg-surface/80 backdrop-blur-md shadow-sm flex items-center justify-between px-margin-mobile h-touch-target">
<div class="flex items-center gap-4">
<button aria-label="Back" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors active-squish">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-primary">Ride Connect</h1>
</div>
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-low">
<span class="material-symbols-outlined text-outline">help</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col justify-center px-margin-mobile py-lg max-w-md mx-auto w-full">
<!-- Welcome Section -->
<div class="mb-xl space-y-2">
<div class="inline-flex items-center px-3 py-1 rounded-full bg-primary-fixed text-on-primary-fixed-variant font-label-sm text-label-sm mb-xs">
<span class="material-symbols-outlined text-[16px] mr-1">person_pin</span>
                ROLE: RIDER
            </div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Complete your profile</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Tell us a bit more about yourself to get started.</p>
</div>
<!-- Registration Form -->
<form class="space-y-lg">
<!-- Input: Full Name -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-1" for="full_name">Full Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">person</span>
</div>
<input class="block w-full h-[56px] pl-12 pr-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline/60" id="full_name" name="full_name" placeholder="Arjun Sharma" type="text">
</div>
</div>
<!-- Input: Phone Number -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider ml-1" for="phone_number">Phone Number</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline group-focus-within:text-primary transition-colors">phone_iphone</span>
</div>
<input class="block w-full h-[56px] pl-12 pr-4 bg-surface-container-low border-0 rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-body-lg text-body-lg text-on-surface placeholder:text-outline/60" id="phone_number" name="phone_number" placeholder="+91 98765 43210" type="tel">
</div>
</div>
<!-- Verification Info Box -->
<div class="flex gap-3 p-4 bg-surface-container-highest/30 rounded-xl border border-outline-variant/20">
<span class="material-symbols-outlined text-primary text-[20px] shrink-0">info</span>
<p class="font-body-md text-body-md text-on-surface-variant">
                    We'll send a verification code to this number to ensure your account security.
                </p>
</div>
<!-- Action Area -->
<div class="pt-lg">
<button class="w-full h-[56px] bg-primary text-on-primary font-title-md text-body-lg rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:brightness-110 active-squish transition-all" type="submit">
                    Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
<!-- Terms & Privacy -->
<p class="mt-xl text-center font-body-md text-body-md text-outline">
            By continuing, you agree to our 
            <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> 
            and 
            <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
        </p>
</main>
<!-- Decorative Bottom Gradient for Depth -->
<div class="fixed bottom-0 left-0 right-0 h-32 bg-gradient-to-t from-surface to-transparent pointer-events-none -z-10"></div>
<script>
        // Simple micro-interaction for input fields
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Form submission prevent default for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Animation for visual feedback
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Verified';
                btn.classList.replace('bg-primary', 'bg-secondary');
            }, 1500);
        });
    </script>
</body></html>
