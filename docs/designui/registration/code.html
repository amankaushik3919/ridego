<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fb; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px #2563eb;
        }
        .subtle-shadow {
            box-shadow: 0 4px 20px 0 rgba(0,0,0,0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col items-center">
<!-- Top Navigation Bar (Shared Component Strategy) -->
<header class="w-full top-0 sticky z-50 bg-surface dark:bg-on-surface flex justify-between items-center px-margin-mobile h-touch-target">
<div class="flex items-center gap-sm transition-transform active:scale-90 cursor-pointer">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</div>
<div class="font-headline-lg-mobile text-headline-lg-mobile text-primary dark:text-primary-fixed-dim">
            Ride Connect
        </div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="w-full max-w-md px-margin-mobile pt-xl pb-32 flex flex-col gap-lg justify-center flex-1">
<!-- Welcome Header -->
<section class="flex flex-col gap-xs items-center text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Complete your profile</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tell us a bit more about yourself to get started.</p>
</section>
<!-- Role Badge (Selected from previous screen) -->
<section class="flex">
<div class="inline-flex items-center gap-xs px-md py-xs bg-secondary-container text-on-secondary-container rounded-full border border-outline-variant/20">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">person_pin_circle</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Role: Professional Driver</span>
</div>
</section>
<!-- Registration Form -->
<form class="flex flex-col gap-lg mt-md items-center">
<!-- Full Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 text-center" for="full-name">Full Name</label>
<div class="group relative flex items-center bg-surface-container-low rounded-xl border border-transparent transition-all focus-within:border-primary-container focus-within:bg-white input-focus-ring">
<div class="pl-md text-on-surface-variant">
<span class="material-symbols-outlined">person</span>
</div>
<input class="w-full h-[56px] bg-transparent border-none focus:ring-0 px-md font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="full-name" placeholder="John Doe" required="" type="text" value="Arjun Sharma">
</div>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1 text-center" for="phone-number">Phone Number</label>
<div class="group relative flex items-center bg-surface-container-low rounded-xl border border-transparent transition-all focus-within:border-primary-container focus-within:bg-white input-focus-ring">
<div class="pl-md text-on-surface-variant">
<span class="material-symbols-outlined">call</span>
</div>
<input class="w-full h-[56px] bg-transparent border-none focus:ring-0 px-md font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="phone-number" placeholder="+1 (555) 000-0000" required="" type="tel" value="+91 98765 43210">
</div>
</div>
<!-- Descriptive Note -->
<div class="bg-primary-fixed/30 rounded-xl p-md flex gap-md justify-center items-center">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="font-body-md text-body-md text-on-primary-fixed-variant text-center">
                    We'll send a verification code to this number to ensure your account security.
                </p>
</div>
<!-- Decorative Image / Background element (Bento-style visual) -->

<!-- Primary Action -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile glass-nav flex flex-col items-center">
<button class="w-full max-w-md h-[56px] bg-primary-container text-on-primary-container rounded-lg font-title-md text-title-md flex items-center justify-center gap-xs transition-all duration-150 active:scale-95 hover:opacity-90 subtle-shadow" type="submit" onclick="window.location.href='{{DATA:SCREEN:SCREEN_2}}'">
                    Continue
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- Implicit Navigation Suppression applied as this is a transactional flow -->
<script>
        // Micro-interaction for input states
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('subtle-shadow');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('subtle-shadow');
            });
        });

        // Form submission prevent default for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Form Submitted');
            // Logic for next screen
        });
    </script>
