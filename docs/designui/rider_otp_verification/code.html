<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
        }
        .otp-input:focus {
            outline: none;
            border-color: #004ac6;

<body class="text-on-surface antialiased min-h-screen flex flex-col">
<!-- Header Section (TopAppBar Guidance) -->

<main class="flex-1 flex flex-col px-margin-mobile py-xl max-w-md mx-auto w-full justify-center items-center">
<!-- Welcome/Intro Section -->
<div class="mb-xl animate-in fade-in slide-in-from-bottom-4 duration-500 text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-md">Verify your number</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Enter the 4-digit code sent to <span class="font-semibold text-on-surface">+91 98765 43210</span>
</p>
</div>
<!-- OTP Input Area -->
<div class="flex justify-between gap-md mb-xl w-full" id="otp-container"><input aria-label="Digit 1" autofocus="" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"><input aria-label="Digit 2" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"><input aria-label="Digit 3" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"><input aria-label="Digit 4" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"><input aria-label="Digit 5" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"><input aria-label="Digit 6" class="otp-input w-12 h-16 text-center text-headline-md-mobile font-bold bg-surface-container-low border-b-4 border-primary rounded-lg transition-all" inputmode="numeric" maxlength="1" pattern="\d*" type="text"></div>
<!-- Action Section -->
<div class="space-y-md mt-xl">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-xl font-title-md text-title-md shadow-sm active:scale-95 transition-transform duration-150 disabled:opacity-50 disabled:active:scale-100 py-sm" id="verify-btn">
                Verify
            </button>
<div class="flex flex-col items-center gap-base">
<button class="font-body-md text-body-md py-sm px-md rounded-lg hover:bg-surface-container-high transition-colors disabled:hover:bg-transparent text-primary font-semibold" id="resend-btn">Resend Code</button>
</div>
</div>
<!-- Visual Decorative Element (Atmospheric Background) -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden opacity-30">
<div class="absolute top-1/4 right-0 w-64 h-64 bg-secondary-container blur-[100px] rounded-full"></div>
<div class="absolute bottom-1/4 left-0 w-80 h-80 bg-primary-fixed blur-[120px] rounded-full"></div>
</div>
</main>
<!-- Success Feedback (Hidden by default) -->
<div class="fixed inset-0 bg-surface/90 backdrop-blur-md z-[100] flex flex-col items-center justify-center p-xl hidden animate-in fade-in duration-300" id="success-overlay">
<div class="bg-secondary-container text-on-secondary-container w-24 h-24 rounded-full flex items-center justify-center mb-lg scale-0 animate-in zoom-in duration-500 delay-150 fill-mode-forwards">
<span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Verified!</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant text-center mt-xs">Setting up your ride connects...</p>
</div>
<script>
        // OTP Focus Logic
        const inputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verify-btn');
        const resendBtn = document.getElementById('resend-btn');
        const timerSpan = document.getElementById('timer');
        const successOverlay = document.getElementById('success-overlay');

        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.inputType === 'deleteContentBackward') return;
                if (input.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Simple Countdown Timer
        let timeLeft = 55;
        const countdown = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(countdown);
                resendBtn.disabled = false;
                resendBtn.innerHTML = "Resend Code";
                resendBtn.classList.remove('text-on-surface-variant');
                resendBtn.classList.add('text-primary', 'font-semibold');
            } else {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerSpan.textContent = `00:${seconds}`;
            }
        }, 1000);

        // Verification Simulation
        verifyBtn.addEventListener('click', () => {
            const code = Array.from(inputs).map(i => i.value).join('');
            if (code.length === 4) {
                verifyBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                verifyBtn.disabled = true;
                
                // Simulate network request
                setTimeout(() => {
                    successOverlay.classList.remove('hidden');
                    // Mock redirection
                    setTimeout(() => {
                        console.log('Redirecting to dashboard...');
                    }, 2000);
                }, 1200);
            }
        });

        // Numeric Keyboard auto-popup on mobile
        window.addEventListener('load', () => {
            inputs[0].focus();
        });
    </script>
