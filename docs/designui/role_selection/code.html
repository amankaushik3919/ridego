<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fb;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .selection-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .selection-card.active {
            border-color: #004ac6;
            background-color: #ffffff;
            box-shadow: 0 10px 25px -5px rgba(0, 74, 198, 0.15), 0 8px 10px -6px rgba(0, 74, 198, 0.1);
            transform: translateY(-2px);
        }
        .selection-card.active .icon-container {
            background-color: #dbe1ff;
            color: #004ac6;
        }
        .selection-card.active .check-mark {
            opacity: 1;
            transform: scale(1);
        }
        .glass-nav {
            backdrop-filter: blur(12px);
            background-color: rgba(255, 255, 255, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Top App Bar (Suppressing global nav as per "Transactional" rule) -->
<header class="w-full top-0 sticky bg-surface flex justify-between items-center px-margin-mobile h-touch-target z-50">
<div class="flex items-center gap-xs">
<span class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Ride Connect</span>
</div>
<button aria-label="Help" class="w-touch-target h-touch-target flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface-variant">help_outline</span>
</button>
</header>
<main class="flex-1 flex flex-col px-margin-mobile py-xl max-w-md mx-auto w-full">
<!-- Header Section -->
<div class="mb-xl text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Welcome</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Choose your role to get started</p>
</div>
<!-- Role Selection Cards -->
<div class="grid grid-cols-1 gap-md">
<!-- Role 1: Vehicle Owner -->
<button class="selection-card relative flex flex-row items-center gap-md p-md bg-surface-container-lowest border border-outline-variant rounded-selection text-left group" id="card-owner" onclick="selectRole('owner')">
<div class="icon-container w-14 h-14 rounded-xl bg-surface-container flex-shrink-0 flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[32px]">directions_car</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Vehicle Owner</h3>
<p class="font-body-md text-body-md text-on-surface-variant">List your car and manage trips with ease.</p>
</div>
<div class="check-mark absolute top-md right-md opacity-0 scale-50 transition-all duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Role 2: Rider -->
<button class="selection-card relative flex flex-row items-center gap-md p-md bg-surface-container-lowest border border-outline-variant rounded-selection text-left group" id="card-rider" onclick="selectRole('rider')">
<div class="icon-container w-14 h-14 rounded-xl bg-surface-container flex-shrink-0 flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-[32px]">directions_walk</span>
</div>
<div class="flex-1">
<h3 class="font-title-md text-title-md text-on-surface mb-xs">Rider</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Find reliable rides for your daily commute.</p>
</div>
<div class="check-mark absolute top-md right-md opacity-0 scale-50 transition-all duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
</div>
<!-- Decorative Illustration Spacer -->
<div class="flex-1 min-h-[40px] flex items-center justify-center opacity-40 py-xl">
<div class="w-full h-[1px] bg-gradient-to-r from-transparent via-outline-variant to-transparent"></div>
</div>
</main>
<!-- Bottom Action Area -->
<footer class="p-margin-mobile pb-xl max-w-md mx-auto w-full">
<button class="w-full h-[56px] font-title-md text-title-md rounded-lg flex items-center justify-center transition-all duration-200 active:scale-98 bg-primary text-on-primary shadow-lg shadow-primary/20" id="continue-btn" onclick="window.location.href='{{DATA:SCREEN:SCREEN_13}}'">
            Continue
        </button>
<p class="mt-md text-center font-label-sm text-label-sm text-on-surface-variant px-md">
            You can always change your role later in your account settings.
        </p>
</footer>
<!-- Interactive Logic -->
<script>
        let selectedRole = null;

        function selectRole(role) {
            selectedRole = role;
            
            // UI Update: Reset Cards
            document.querySelectorAll('.selection-card').forEach(card => {
                card.classList.remove('active');
            });
            
            // UI Update: Highlight Selected
            const activeCard = document.getElementById(`card-${role}`);
            activeCard.classList.add('active');
            
            // UI Update: Enable Button
            const btn = document.getElementById('continue-btn');
            btn.disabled = false;
            btn.classList.remove('bg-outline-variant', 'text-on-surface-variant', 'cursor-not-allowed');
            btn.classList.add('bg-primary', 'text-on-primary', 'shadow-lg', 'shadow-primary/20');
            
            // Micro-interaction: Haptic simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        }

        // Action for Continue
        document.getElementById('continue-btn').addEventListener('click', function() {
            if (!this.disabled) {
                this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                setTimeout(() => {
                    alert(`Proceeding as ${selectedRole.charAt(0).toUpperCase() + selectedRole.slice(1)}`);
                    this.innerHTML = 'Continue';
                }, 800);
            }
        });
    </script>




</body></html>
