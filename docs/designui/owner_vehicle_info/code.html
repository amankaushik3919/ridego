<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-surface min-h-screen flex flex-col">
<!-- Top App Bar (Shared Component Logic) -->
<header class="w-full top-0 sticky z-40 bg-surface dark:bg-on-surface flex justify-between items-center px-margin-mobile h-touch-target">
<div class="flex items-center gap-sm">
<button class="material-symbols-outlined text-on-surface-variant hover:bg-surface-container-low transition-colors rounded-full p-xs scale-95 active:scale-90 transition-transform">arrow_back</button>
<h1 class="font-title-md text-title-md text-primary dark:text-primary-fixed-dim">Vehicle Info</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border border-outline-variant">
<img class="w-full h-full object-cover" data-alt="A clean, professional headshot of a modern urban mobility business owner in a bright, minimalist setting. The person is smiling confidently, wearing a sleek navy blue polo shirt. The background is a soft, out-of-focus modern office with high-key white lighting and subtle blue accents, maintaining a premium and dependable brand personality." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC1bFqijpLVax4swhzD6dD1kIjcT8HlyZgnjZJEeU-24rJSO3YP5dGeXxQu4PP1wo-23V_JTq29l_0Ux5sPFc-fpNXJNyf73luT-LtV4gf13P0hiJbIYd5Cw0BMyGAsF0uyGere2yHdbmvnRuglpx99_-6iq5ZMemOJvaQchGUdAh5m1npmhwp0N90ezcG_Qu6PpEobMGzqSv_CDKQ6Tm2Bz60CKZNiqnowngBjzenO0pQ-q7RBofpRpw">
</div>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-margin-mobile pt-lg pb-xl max-w-lg mx-auto w-full">
<!-- Illustration/Decorative Section -->
<section class="mb-xl text-center">
<div class="relative h-48 w-full rounded-20 bg-surface-container-low overflow-hidden flex items-center justify-center border border-outline-variant/30 mb-md">

<div class="relative z-10 flex flex-col items-center">
<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">directions_car</span>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-xs tracking-widest uppercase">Registry details</p>
</div>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Vehicle Registration</h2>
<p class="font-body-md text-body-md text-on-surface-variant mt-xs px-md">Enter your official vehicle number plate details to link this asset to your profile.</p>
</section>
<!-- Form Section -->
<section class="flex-1 space-y-lg">
<!-- Vehicle Number Input -->
<div class="space-y-xs group">
<label class="font-label-sm text-label-sm text-outline ml-xs" for="vehicle_number">Vehicle Number</label>
<div class="relative flex items-center rounded-20 p-xs transition-all duration-300 border-2 border-transparent focus-within:border-primary focus-within:bg-surface-lowest shadow-sm bg-secondary"><div class="w-12 h-12 flex items-center justify-center text-on-primary"><span class="material-symbols-outlined">license</span></div><input class="flex-1 bg-transparent border-none focus:ring-0 text-title-md font-bold text-on-primary placeholder:text-on-primary/50 uppercase tracking-widest" id="vehicle_number" placeholder="DL01AB1234" type="text"><button class="material-symbols-outlined text-on-primary/70 hover:text-on-primary mr-xs transition-colors" onclick="document.getElementById('vehicle_number').value = ''">cancel</button></div>
<p class="font-body-md text-[12px] text-on-surface-variant/70 ml-xs italic">Format: State Code + District + Series + Number</p>
</div>
<!-- Contextual Info Card (Glassmorphic Accent) -->
<div class="flex items-center gap-md p-md"><input type="checkbox" id="verify_consent" class="w-6 h-6 rounded border-outline-variant text-primary focus:ring-primary"><label for="verify_consent" class="font-body-md text-on-surface-variant">aapka save kiya jayega deteils for verify</label></div>
</section>
<!-- Bottom Action -->
<section class="mt-xl pb-xl">
<button class="w-full h-14 bg-primary text-on-primary rounded-20 font-title-md flex items-center justify-center gap-xs shadow-lg shadow-primary/20 hover:bg-primary-container transition-all active:scale-[0.98]" onclick="window.location.href='{{DATA:SCREEN:SCREEN_10}}'">
<span class="">Save Vehicle Details</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>

</section>
</main>
<!-- Bottom Nav Bar (Shared Component Logic) -->
<!-- Determined active navigation: None specifically for a focused form page, but UI shell persists -->

<script>
        // Simple input formatting interaction
        const input = document.getElementById('vehicle_number');
        input.addEventListener('input', (e) => {
            let val = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
            // Limit to standard plate length roughly
            if(val.length > 10) val = val.substring(0, 10);
            e.target.value = val;
        });

        // Add visual feedback for "Save"
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Saving...</span>';
            setTimeout(() => {
                this.innerHTML = '<span class="material-symbols-outlined">check_circle</span><span>Details Saved</span>';
                this.classList.replace('bg-primary', 'bg-secondary');
            }, 1200);
        });
    </script>
