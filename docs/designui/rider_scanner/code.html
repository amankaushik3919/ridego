<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface": "#191c1e",
                    "secondary-fixed": "#6ffbbe",
                    "surface-variant": "#e1e2e4",
                    "on-primary-fixed-variant": "#003ea8",
                    "surface-dim": "#d9dadc",
                    "surface-tint": "#0053db",
                    "on-background": "#191c1e",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#00714d",
                    "secondary-fixed-dim": "#4edea3",
                    "tertiary-fixed": "#ffddb8",
                    "on-primary": "#ffffff",
                    "secondary": "#006c49",
                    "tertiary-fixed-dim": "#ffb95f",
                    "inverse-surface": "#2e3132",
                    "on-secondary-fixed": "#002113",
                    "surface-bright": "#f8f9fb",
                    "secondary-container": "#6cf8bb",
                    "on-tertiary": "#ffffff",
                    "tertiary-container": "#996100",
                    "outline": "#737686",
                    "on-secondary-fixed-variant": "#005236",
                    "on-primary-fixed": "#00174b",
                    "primary-fixed": "#dbe1ff",
                    "surface-container": "#edeef0",
                    "on-tertiary-container": "#ffeedd",
                    "outline-variant": "#c3c6d7",
                    "surface-container-highest": "#e1e2e4",
                    "surface-container-high": "#e7e8ea",
                    "surface-container-low": "#f3f4f6",
                    "on-surface-variant": "#434655",
                    "primary-fixed-dim": "#b4c5ff",
                    "on-error": "#ffffff",
                    "on-error-container": "#93000a",
                    "background": "#f8f9fb",
                    "on-tertiary-fixed-variant": "#653e00",
                    "on-tertiary-fixed": "#2a1700",
                    "surface-container-lowest": "#ffffff",
                    "inverse-primary": "#b4c5ff",
                    "error-container": "#ffdad6",
                    "inverse-on-surface": "#f0f1f3",
                    "on-primary-container": "#eeefff",
                    "primary-container": "#2563eb",
                    "on-secondary": "#ffffff",
                    "tertiary": "#784b00",
                    "surface": "#f8f9fb",
                    "primary": "#004ac6"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "xs": "8px",
                    "md": "16px",
                    "margin-mobile": "20px",
                    "lg": "24px",
                    "touch-target": "48px",
                    "xl": "32px",
                    "base": "4px",
                    "sm": "12px",
                    "gutter": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "title-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "label-sm": ["Inter"],
                    "display-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "title-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                    "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
            }
          },
        },
      }

<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .scanner-line {
            height: 2px;
            background: linear-gradient(90deg, transparent, #004ac6, transparent);
            position: absolute;
            width: 100%;
            top: 0;
            animation: scan 2.5s ease-in-out infinite;
        }
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }
        .scanner-corner {
            width: 32px;
            height: 32px;
            border-color: #ffffff;
            position: absolute;
        }
        .corner-tl { top: -2px; left: -2px; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
        .corner-tr { top: -2px; right: -2px; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: -2px; right: -2px; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }
        
        .glass-overlay {
            background: rgba(25, 28, 30, 0.7);
            backdrop-filter: blur(4px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- TopAppBar (Suppressed for focused task, using simplified Back Action) -->
<header class="w-full top-0 sticky z-50 bg-surface flex justify-between items-center px-margin-mobile h-touch-target">
<button class="flex items-center justify-center w-touch-target h-touch-target hover:bg-surface-container-low transition-colors rounded-full active:scale-90" onclick="history.back()">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-title-md text-title-md text-on-surface">Scan to Ride</h1>
<div class="w-touch-target"></div> <!-- Spacer -->
</header>
<main class="flex-grow flex flex-col items-center px-margin-mobile pt-xl pb-32">
<!-- Illustration Section -->
<div class="w-full max-w-sm mb-xl">
<div class="relative aspect-square rounded-xl overflow-hidden bg-surface-container-high shadow-lg">
<!-- Background Image of a Vehicle -->
<div class="absolute inset-0 bg-cover bg-center" data-alt="A sleek, modern electric scooter parked on a clean urban sidewalk during the daytime. The lighting is bright and natural, reflecting a premium city lifestyle. The scooter features minimalist design details in primary blue and matte silver, perfectly aligned with a professional ride-sharing aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDaycQknjzU5_NIF2IGVb-E8e_WZNCm3EVrP5RMOPxB4ROqKaczwWw_iWTN6uiBlcYNI8M5_ADp-UHl2W7pAXcrkz5847G3rZeV7ek1pj7IAgo14xVan_4EdQO59K0sxETaWn_1JAraV07GZrt10myFx_V1qzEECxqtoGtqnkKtqVAk7jMbRXh7BDg2sa4Lzn14jseMgSXPW6oUYGgKEsdBByj8FIRYH3B7vmfP9nv9wtkVl_gNHtChKQ')"></div>
<!-- Scanner UI Overlay -->
<div class="absolute inset-0 glass-overlay flex items-center justify-center">
<div class="w-64 h-64 relative">
<!-- Camera Viewport Simulation -->
<div class="absolute inset-0 bg-black/20 rounded-xl overflow-hidden">
<div class="absolute inset-0 bg-cover bg-center opacity-90 scale-110" data-alt="A close-up, high-detail macro shot of a QR code printed on a high-quality weather-resistant sticker attached to a metallic surface. The QR code is sharp and clear, intended for a digital interface to recognize. The background is a blurred silver metallic texture of a vehicle frame." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCw0YndoY8LYriB-dW0ACWAWehHXQnWkRrrI35WzpS4BJejlPdmqOLQr9oJbhXM7oeYGZn005vhlSQRmx9K0AuxxfIjXYErNbncPyjXWKetkm_h6XxA3wVWSl95w2Z-m_oTYc8hHBwgtGnnzXxzJE_UcouBC-egjbvu-6AfuaZdWBbfzE7xu2QKX6ONmX4yreGBv1aKm4qCiydL05dg7MQBc99zt5NvE4CnkwZL6ZC4DCpJ_tMd-v5e8Q')"></div>
<div class="scanner-line"></div>
</div>
<!-- Scan Corners -->
<div class="scanner-corner corner-tl"></div>
<div class="scanner-corner corner-tr"></div>
<div class="scanner-corner corner-bl"></div>
<div class="scanner-corner corner-br"></div>
</div>
</div>
</div>
</div>
<!-- Text Guidance -->
<div class="text-center space-y-xs max-w-xs mb-xl">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Scan Vehicle QR Code</h2>
<p class="font-body-md text-body-md text-on-surface-variant">
                Point your camera at the QR code located on the handlebars or the rear fender of the vehicle to start your ride.
            </p>
</div>
<!-- Instructions Bento-ish Grid -->
<div class="w-full grid grid-cols-2 gap-md mt-auto">
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant/30 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-xs" style="font-variation-settings: 'FILL' 1;">lightbulb</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Check Lighting</span>
</div>
<div class="bg-surface-container-low p-md rounded-xl border border-outline-variant/30 flex flex-col items-center text-center">
<span class="material-symbols-outlined text-primary mb-xs" style="font-variation-settings: 'FILL' 1;">qr_code_2</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">Stay Steady</span>
</div>
</div>
</main>
<!-- Bottom Actions Container -->
<div class="fixed bottom-0 w-full p-margin-mobile bg-surface/80 backdrop-blur-xl border-t border-white/10 z-50">
<div class="flex flex-col gap-sm">
<button class="w-full h-touch-target bg-primary text-on-primary font-title-md text-title-md rounded-lg shadow-lg active:scale-95 transition-transform flex items-center justify-center gap-sm" onclick="window.location.href='{{DATA:SCREEN:SCREEN_7}}'">
<span class="material-symbols-outlined">photo_camera</span>
                Open Camera
            </button>
<button class="w-full h-touch-target bg-transparent text-primary font-body-lg text-body-lg rounded-lg active:opacity-70 transition-opacity flex items-center justify-center gap-sm">
<span class="material-symbols-outlined">keyboard</span>
                Enter Vehicle ID Manually
            </button>
</div>
</div>
<!-- Hidden Interaction Helper -->
<script>
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            // Visual feedback for button press
            this.classList.add('bg-primary-container');
            setTimeout(() => {
                this.classList.remove('bg-primary-container');
                alert('Camera permission requested. Searching for QR codes...');
            }, 200);
        });
    </script>


</body></html>
