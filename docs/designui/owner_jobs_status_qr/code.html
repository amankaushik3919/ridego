<!-- Destination Selection -->

<script>
        let isOnline = false;
        let selectedRoute = null;

        function toggleOnline() {
            isOnline = !isOnline;
            const toggle = document.getElementById('online-toggle');
            const knob = document.getElementById('toggle-knob');
            const statusText = document.getElementById('status-text');
            const statusSubtext = document.getElementById('status-subtext');
            const statusIndicator = document.getElementById('status-indicator');
            const card = document.getElementById('status-card');

            if (isOnline) {
                // To Online
                toggle.classList.remove('bg-surface-container-highest');
                toggle.classList.add('bg-primary');
                knob.classList.remove('translate-x-0');
                knob.classList.add('translate-x-6');
                
                statusText.innerText = 'You are Online';
                statusSubtext.innerText = 'Receiving new booking requests';
                statusIndicator.classList.remove('bg-outline');
                statusIndicator.classList.add('bg-secondary');
                
                card.classList.add('border-primary', 'bg-primary/5');
            } else {
                // To Offline
                toggle.classList.remove('bg-primary');
                toggle.classList.add('bg-surface-container-highest');
                knob.classList.remove('translate-x-6');
                knob.classList.add('translate-x-0');
                
                statusText.innerText = 'Go Online';
                statusSubtext.innerText = 'You are currently offline';
                statusIndicator.classList.remove('bg-secondary');
                statusIndicator.classList.add('bg-outline');
                
                card.classList.remove('border-primary', 'bg-primary/5');
                
                // Hide QR code if user goes offline
                hideQR();
            }
        }

        function selectDestination(name) {
            document.getElementById('route-dropdown').classList.add('hidden');
            document.getElementById('selected-route-name').innerText = name;
            selectedRoute = name;

            if (!isOnline) {
                alert("Please go online first to select a route.");
                return;
            }

            showQR(name);
        }

        function showQR(name) {
            const qrSection = document.getElementById('qr-section');
            document.getElementById('selected-dest-label').innerText = `Scan to book for ${name}`;
            
            qrSection.classList.remove('hidden');
            // Force reflow
            void qrSection.offsetWidth;
            
            qrSection.classList.replace('opacity-0', 'opacity-100');
            qrSection.classList.replace('translate-y-4', 'translate-y-0');
            
            qrSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function hideQR() {
            const qrSection = document.getElementById('qr-section');
            if (!qrSection.classList.contains('hidden')) {
                qrSection.classList.replace('opacity-100', 'opacity-0');
                qrSection.classList.replace('translate-y-0', 'translate-y-4');
                setTimeout(() => {
                    qrSection.classList.add('hidden');
                }, 300);
            }
        }
    </script>
