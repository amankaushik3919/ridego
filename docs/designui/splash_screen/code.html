<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        .animate-slide-up {
            animation: slideUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            animation-delay: 0.3s;
            opacity: 0;
        }
        .animate-delay-500 {
            animation-delay: 0.5s;
        }
        .glass-background {
            background: radial-gradient(circle at 50% 50%, rgba(255,255,255,1) 0%, rgba(248,249,251,1) 100%);
        }
        .logo-glow {
            filter: drop-shadow(0 10px 25px rgba(0, 74, 198, 0.1));
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md overflow-hidden antialiased">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col justify-between items-center glass-background px-margin-mobile py-xl">
<!-- Top Decorative Spacer -->
<div class="h-12 w-full"></div>
<!-- Center Content: Logo and Brand -->
<div class="flex flex-col items-center justify-center text-center space-y-lg animate-fade-in">
<!-- Logo Section -->
<div class="relative w-48 h-48 md:w-64 md:h-64 flex items-center justify-center mb-md">
<!-- Subtle background glow -->
<div class="absolute inset-0 bg-primary/5 blur-3xl rounded-full"></div>
<!-- Main Logo -->
<img alt="Ride Connect Logo" class="w-full h-full object-contain logo-glow relative z-10" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFLFA_rcbVJfkWqiwSOvhiWaI0KDq5q0QCMzE967gxNjuS4Vn-6XfIZDGNpmhwxoEsh2hQMuN-AadivZu54v9-QE1TaW51gkdBOvL9B5RQrqCJNnLzvLN6pEVyREHYfSQJk5SqXLC4twP1COo5aCBqs9naPzl7kGQpeVDCL1iNY0ut8VK51Pev-rM9msCh43WHI3WVycwBi9QyWXBDBQV33UqjbizXdm2lLHtMhTVbUWx6B2l1I0sFEQ" style="transform: translate(3.7px, 1.8px);">
</div>
<!-- Brand Identity -->
<div class="space-y-xs">
<h1 class="font-display-lg text-display-lg text-on-surface tracking-tight">
                    Ride <span class="text-primary">Connect</span>
</h1>
<p class="font-title-md text-title-md text-on-surface-variant max-w-[280px] mx-auto opacity-0 animate-slide-up animate-delay-500">
                    Safe &amp; Easy Daily Ride Management
                </p>
</div>
</div>
<!-- Footer Actions -->
<div class="w-full max-w-sm animate-slide-up">
<button class="w-full h-[56px] bg-primary text-on-primary rounded-lg font-title-md text-title-md shadow-lg shadow-primary/20 flex items-center justify-center gap-sm active:scale-95 transition-transform duration-150 group" onclick="window.location.href='{{DATA:SCREEN:SCREEN_5}}'">
<span class="">Get Started</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<!-- Contextual Login Option -->
<p class="mt-lg text-center font-label-sm text-label-sm text-on-surface-variant">
                Already have an account? <a class="text-primary font-bold hover:underline" href="#">Log In</a>
</p>
<!-- Bottom Indicator for Gesture Navigation (Visual Only) -->
<div class="mt-xl h-1 w-32 bg-on-surface/5 mx-auto rounded-full"></div>
</div>
</main>
<script>
        // Subtle Mouse/Gyro Parallax for atmospheric depth
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            const logo = document.querySelector('.logo-glow');
            if (logo) {
                logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Haptic feedback simulation for the button
        const startBtn = document.querySelector('button');
        startBtn.addEventListener('touchstart', () => {
            if (window.navigator.vibrate) {
                window.navigator.vibrate(10);
            }
        });
    </script>


</body></html>
